name: vllm-ray-worker

services:
  ray-worker:
    image: vllm-openai-ray:v0.26.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepseek-v4-ray-worker
    restart: unless-stopped
    network_mode: host
    ipc: host
    gpus: all
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      NCCL_SOCKET_IFNAME: ${ROCE_IFACE}
      GLOO_SOCKET_IFNAME: ${ROCE_IFACE}
      VLLM_HOST_IP: ${NODE_IP}
      VLLM_PP_LAYER_PARTITION: ${PP_PARTITION}
      RAY_ADDRESS: ${HEAD_IP}:6379
      RAY_memory_monitor_refresh_ms: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/vllm-cache:/root/.cache/vllm
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
    entrypoint: ["ray"]
    command:
      - start
      - --address=${HEAD_IP}:6379
      - --node-ip-address=${NODE_IP}
      - --num-cpus=20
      - --num-gpus=1
      - --block
