name: vllm-ray-worker

# Must match the official vLLM v0.28.0 head runtime exactly.
services:
  ray-worker:
    image: vllm/vllm-openai:v0.28.0@sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14
    container_name: deepseek-v4-ray-worker
    restart: unless-stopped
    network_mode: host
    ipc: host
    gpus: all
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      NODE_IP: ${NODE_IP}
      HEAD_IP: ${HEAD_IP}
      ROCE_IFACE: ${ROCE_IFACE}
      NCCL_SOCKET_IFNAME: ${ROCE_IFACE}
      GLOO_SOCKET_IFNAME: ${ROCE_IFACE}
      VLLM_HOST_IP: ${NODE_IP}
      RAY_ADDRESS: ${HEAD_IP}:6379
      RAY_memory_monitor_refresh_ms: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/vllm-cache:/root/.cache/vllm
    entrypoint: ["ray"]
    command:
      - start
      - --address=${HEAD_IP}:6379
      - --node-ip-address=${NODE_IP}
      - --num-cpus=20
      - --num-gpus=1
      - --block
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
