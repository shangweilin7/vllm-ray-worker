name: vllm-ray-worker

# Must match the official vLLM v0.28.0 head runtime exactly.
services:
  ray-worker:
    # Must be built from the same Dockerfile and pinned official vLLM parent
    # as the head; it adds the Ray worker executable.
    image: vllm-openai-ray:v0.28.0-ray2.58.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepseek-v4-ray-worker
    restart: unless-stopped
    network_mode: host
    ipc: host
    gpus: all
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # Fail Compose before creating a container when host networking is unset.
      NODE_IP: ${NODE_IP:?Set NODE_IP to this host's RoCE-reachable IP}
      HEAD_IP: ${HEAD_IP:?Set HEAD_IP to the Ray head's RoCE-reachable IP}
      ROCE_IFACE: ${ROCE_IFACE:?Set ROCE_IFACE to the RoCE NIC name}
      NCCL_SOCKET_IFNAME: ${ROCE_IFACE:?Set ROCE_IFACE to the RoCE NIC name}
      GLOO_SOCKET_IFNAME: ${ROCE_IFACE:?Set ROCE_IFACE to the RoCE NIC name}
      VLLM_HOST_IP: ${NODE_IP}
      RAY_ADDRESS: ${HEAD_IP}:6379
      RAY_memory_monitor_refresh_ms: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/vllm-cache:/root/.cache/vllm
    entrypoint: ["ray"]
    command:
      - start
      - --address=${HEAD_IP}:6379
      - --node-ip-address=${NODE_IP}
      - --num-cpus=20
      - --num-gpus=1
      - --block
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
